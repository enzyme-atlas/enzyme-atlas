name: Validate and deploy Enzyme Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate data and JavaScript
        run: |
          python scripts/validate_site.py
          python scripts/test_weekly_pipeline.py
          python scripts/check_public_disclosure.py --verbose
          python scripts/set_site_address.py --check
          python scripts/prune_public.py --check
          node --check i18n.js
          node --check reading-list.js
          node --check app.js
          node --check search.js
          node --check classics.js
          node --check archive.js
          node --check topics.js
          node scripts/test_classics_ui.js
          node scripts/test_search_pool.js

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The Pages artifact is the repository root, so anything committed here is
      # publicly downloadable. Keep the development tooling, agent notes and
      # audit reports out of the published output; scripts/prune_public.py holds
      # the list and fails the build if a kept file would leak.
      - name: Remove non-public files from the artifact
        run: python scripts/prune_public.py --apply
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
